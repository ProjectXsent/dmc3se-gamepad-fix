; DMC3Input - SDL controller support for Devil May Cry 3 Special Edition
; Place next to dinput8.dll (the game folder). Changes apply on next game start.

[General]
; xbox = DirectInput Xbox-360 layout, plus LT/RT exposed as buttons 10/11
; ps2  = typical generic PS2->USB adapter layout (right stick on Z/Rz)
Preset=xbox
; Write DMC3Input.log next to the DLL (very useful while diagnosing)
Log=0
; Hide the OS's own gamepad entries so the game only sees the SDL one
HideRealGamepads=1
; Show the virtual pad even if no controller is plugged in at launch
AlwaysExpose=1
; Which connected controller to use (0 = first)
ControllerIndex=0
DeadzonePercent=15
TriggerThresholdPercent=50
ButtonCount=16

; Override any virtual button.
;   Values: None A B X Y Back Guide Start LeftStick RightStick LeftShoulder RightShoulder
;           DpadUp DpadDown DpadLeft DpadRight Misc1 Paddle1-4 Touchpad LT RT
; (SDL names are Xbox-positional: A=Cross, B=Circle, X=Square, Y=Triangle)
[Buttons]
Button0=X
Button1=Y
Button2=A
Button3=B
Button4=LB
Button5=RB
Button6=LT
Button7=RT
Button8=LeftStick
Button9=RightStick
Button10=Back
Button11=Start

; Override axes. 
;   Values: None LeftX LeftY RightX RightY Triggers LeftTrigger RightTrigger
[Axes]
X=RightY
Y=RightX
Z=LeftY
Rx=LeftX
Ry=None
Rz=None
